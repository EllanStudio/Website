name: Deploy homepage

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'tests/**'
      - '.github/workflows/deploy-homepage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/www/wwwroot/homepage/homepage-1.3' }}
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false

      - name: Test status and telemetry compatibility
        run: |
          node --test tests/server-status.test.mjs tests/wiki-content.test.mjs tests/wiki-editor.test.mjs
          php -l website/api/plan-network.php
          php -l website/api/plan-performance.php
          php tests/plan-performance.test.php

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy homepage to production
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_PATH" = '/www/wwwroot/homepage/homepage-1.3'

          ssh_options=(
            -p "$DEPLOY_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=6
            -o TCPKeepAlive=yes
          )
          target="$DEPLOY_USER@$DEPLOY_HOST"
          state_dir="$(dirname "$DEPLOY_PATH")/.deploy-state-homepage-1.3"
          manifest="$state_dir/manifest.sha256"

          # The link to the site host drops connections often; retry instead of
          # failing the whole deploy on a single reset.
          remote() {
            local attempt
            for attempt in 1 2 3 4; do
              if ssh "${ssh_options[@]}" "$target" "$@"; then
                return 0
              fi
              printf 'ssh attempt %s failed; retrying.\n' "$attempt" >&2
              sleep 8
            done
            return 1
          }

          # Incremental deploy: only files whose checksum changed are uploaded.
          # The previous manifest lives next to the site, so a missing one simply
          # degrades to a full upload on the first run.
          ( cd website && find . -type f -print0 | sort -z | xargs -0 sha256sum ) > "$RUNNER_TEMP/new.sha256"
          remote "cat '$manifest' 2>/dev/null || true" > "$RUNNER_TEMP/old.sha256"
          grep -vxF -f "$RUNNER_TEMP/old.sha256" "$RUNNER_TEMP/new.sha256" > "$RUNNER_TEMP/changed.lines" || true
          awk '{ p = $2; sub(/^\*/, "", p); print p }' "$RUNNER_TEMP/new.sha256" | sort > "$RUNNER_TEMP/new.paths"
          awk '{ p = $2; sub(/^\*/, "", p); print p }' "$RUNNER_TEMP/old.sha256" | sort > "$RUNNER_TEMP/old.paths"
          comm -13 "$RUNNER_TEMP/new.paths" "$RUNNER_TEMP/old.paths" > "$RUNNER_TEMP/delete.paths" || true

          if [ -s "$RUNNER_TEMP/changed.lines" ]; then
            awk '{ p = $2; sub(/^\*/, "", p); print p }' "$RUNNER_TEMP/changed.lines" > "$RUNNER_TEMP/changed.paths"
            printf 'Uploading %s changed file(s).\n' "$(wc -l < "$RUNNER_TEMP/changed.paths")"
            tar -C website -czf "$RUNNER_TEMP/changes.tgz" -T "$RUNNER_TEMP/changed.paths"
            uploaded=""
            for attempt in 1 2 3; do
              if remote "cat > /tmp/homepage-changes.tgz" < "$RUNNER_TEMP/changes.tgz" \
                 && remote "tar -xzf /tmp/homepage-changes.tgz -C '$DEPLOY_PATH' && rm -f /tmp/homepage-changes.tgz"; then
                uploaded=yes
                break
              fi
              printf 'Upload attempt %s failed; retrying.\n' "$attempt"
              sleep 10
            done
            test -n "$uploaded"
          else
            printf 'No changed files to upload.\n'
          fi

          if [ -s "$RUNNER_TEMP/delete.paths" ]; then
            printf 'Removing %s stale path(s).\n' "$(wc -l < "$RUNNER_TEMP/delete.paths")"
            remote "cd '$DEPLOY_PATH' && while IFS= read -r stale; do [ -n \"\$stale\" ] && rm -rf -- \"\$stale\"; done" < "$RUNNER_TEMP/delete.paths"
          fi

          remote "mkdir -p '$state_dir' && cat > '$manifest'" < "$RUNNER_TEMP/new.sha256"
          printf 'Deployed %s file(s); manifest written to %s.\n' "$(wc -l < "$RUNNER_TEMP/new.sha256")" "$manifest"

      - name: Verify uploaded homepage
        shell: bash
        run: |
          set -euo pipefail

          curl_options=(
            --fail
            --silent
            --show-error
            --insecure
            --connect-timeout 5
            --max-time 45
            --retry 3
            --retry-delay 5
            --retry-all-errors
            --resolve "ellan.site:443:$DEPLOY_HOST"
          )
          local_checksum="$(sha256sum website/index.html | awk '{print $1}')"
          served_checksum="$(curl "${curl_options[@]}" 'https://ellan.site/' | sha256sum | awk '{print $1}')"
          printf 'Local index.html SHA-256: %s\n' "$local_checksum"
          printf 'Served index.html SHA-256: %s\n' "$served_checksum"
          test "$local_checksum" = "$served_checksum"

          local_plan_checksum="$(sha256sum website/plan.html | awk '{print $1}')"
          served_plan_checksum="$(curl "${curl_options[@]}" 'https://ellan.site/plan.html' | sha256sum | awk '{print $1}')"
          printf 'Local plan.html SHA-256: %s\n' "$local_plan_checksum"
          printf 'Nginx plan.html SHA-256: %s\n' "$served_plan_checksum"
          test "$local_plan_checksum" = "$served_plan_checksum"
          if grep -Fq '43.249.195.103:16884' website/plan.html ||
             grep -Fq 'PLAN 面板' website/plan.html; then
            printf 'Forbidden original PLAN panel reference found in plan.html\n' >&2
            exit 1
          fi

          local_gameplay_checksum="$(sha256sum website/gameplay.html | awk '{print $1}')"
          served_gameplay_checksum="$(curl "${curl_options[@]}" 'https://ellan.site/gameplay.html' | sha256sum | awk '{print $1}')"
          printf 'Local gameplay.html SHA-256: %s\n' "$local_gameplay_checksum"
          printf 'Nginx gameplay.html SHA-256: %s\n' "$served_gameplay_checksum"
          test "$local_gameplay_checksum" = "$served_gameplay_checksum"

          local_thirteen_checksum="$(sha256sum website/thirteen-bells.html | awk '{print $1}')"
          served_thirteen_checksum="$(curl "${curl_options[@]}" 'https://ellan.site/thirteen-bells.html' | sha256sum | awk '{print $1}')"
          printf 'Local thirteen-bells.html SHA-256: %s\n' "$local_thirteen_checksum"
          printf 'Nginx thirteen-bells.html SHA-256: %s\n' "$served_thirteen_checksum"
          test "$local_thirteen_checksum" = "$served_thirteen_checksum"

          for asset in 'css/thirteen-bells.css?v=20260813-v1' 'js/thirteen-bells.js?v=20260813-v1'; do
            asset_path="${asset%%\?*}"
            asset_name="$(printf '%s' "$asset" | tr '/' '-')"
            curl "${curl_options[@]}" -o "$RUNNER_TEMP/$asset_name.body" "https://ellan.site/$asset"
            test "$(sha256sum "website/$asset_path" | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/$asset_name.body" | awk '{print $1}')"
          done

          for wiki_file in wiki.html css/wiki.css js/wiki.js js/wiki-data.js js/server-status.js js/vendor/lucide.min.js; do
            local_wiki_checksum="$(sha256sum "website/$wiki_file" | awk '{print $1}')"
            served_wiki_checksum="$(curl "${curl_options[@]}" "https://ellan.site/$wiki_file?v=$GITHUB_SHA" | sha256sum | awk '{print $1}')"
            printf 'Verify handbook %s: %s\n' "$wiki_file" "$served_wiki_checksum"
            test "$local_wiki_checksum" = "$served_wiki_checksum"
          done

          for seo_file in robots.txt sitemap.xml llms.txt; do
            local_seo_checksum="$(sha256sum "website/$seo_file" | awk '{print $1}')"
            served_seo_checksum="$(curl "${curl_options[@]}" "https://ellan.site/$seo_file" | sha256sum | awk '{print $1}')"
            printf 'Local %s SHA-256: %s\n' "$seo_file" "$local_seo_checksum"
            printf 'Nginx %s SHA-256: %s\n' "$seo_file" "$served_seo_checksum"
            test "$local_seo_checksum" = "$served_seo_checksum"
          done

          noindex_pages=(
            'links/index.html'
            'links/wasm/index.html'
            'links/Eaglercraft_1.12_Offline_en_US.html'
            'temp/index.html'
            'temp/about.html'
            'temp/timeline.html'
            'temp/survivors.html'
            'temp/prevent.html'
          )
          for noindex_page in "${noindex_pages[@]}"; do
            head_bytes="$(curl "${curl_options[@]}" --max-time 60 "https://ellan.site/$noindex_page" 2>/dev/null | head -c 20000 || true)"
            case "$head_bytes" in
              *'<meta name="robots" content="noindex, nofollow"'*) ;;
              *) printf 'Missing noindex meta on %s\n' "$noindex_page" >&2; exit 1 ;;
            esac
          done
          printf 'Checked noindex meta on %s page(s) over HTTPS.\n' "${#noindex_pages[@]}"

          for asset in 'css/plan.css?v=20260810-plan-telemetry-v3' 'js/plan.js?v=20260810-plan-telemetry-v3'; do
            asset_path="${asset%%\?*}"
            asset_name="$(printf '%s' "$asset" | tr '/' '-')"
            asset_content_type="$(curl "${curl_options[@]}" --dump-header "$RUNNER_TEMP/$asset_name.headers" -o "$RUNNER_TEMP/$asset_name.body" -w '%{content_type}' "https://ellan.site/$asset")"
            case "$asset_content_type" in
              text/css*|application/javascript*|text/javascript*) ;;
              *) printf 'Unexpected content type for %s: %s\n' "$asset" "$asset_content_type" >&2; exit 1 ;;
            esac
            local_asset_checksum="$(sha256sum "website/$asset_path" | awk '{print $1}')"
            served_asset_checksum="$(sha256sum "$RUNNER_TEMP/$asset_name.body" | awk '{print $1}')"
            printf 'Local %s SHA-256: %s\n' "$asset" "$local_asset_checksum"
            printf 'Nginx %s SHA-256: %s\n' "$asset" "$served_asset_checksum"
            test "$local_asset_checksum" = "$served_asset_checksum"
          done
          plan_content_type="$(curl "${curl_options[@]}" --dump-header "$RUNNER_TEMP/plan-network.headers" -o "$RUNNER_TEMP/plan-network.json" -w '%{content_type}' 'https://ellan.site/api/plan-network.php')"
          case "$plan_content_type" in
            application/json*) ;;
            *) printf 'Unexpected PLAN API content type: %s\n' "$plan_content_type" >&2; exit 1 ;;
          esac
          grep -i -F 'x-robots-tag: noindex, nofollow' "$RUNNER_TEMP/plan-network.headers" > /dev/null
          jq -e '
            def numeric_object($required):
              (type == "object") and
              ((keys | sort) == ($required | sort)) and
              all(.[]; type == "number");
            (.timestamp | type == "number") and
            (.numbers | numeric_object([
              "sessions", "regular_players", "session_length_avg", "best_peak_players",
              "player_playtime", "current_uptime", "last_peak_players", "best_peak_date",
              "total_players", "playtime", "last_peak_date", "online_players"
            ])) and
            (.players | numeric_object([
              "new_players_1d", "unique_players_1d", "new_players_7d",
              "unique_players_7d", "new_players_30d", "unique_players_30d"
            ])) and
            (.weeks | numeric_object([
              "start", "midpoint", "end", "unique_before", "unique_after",
              "new_before", "new_after", "regular_before", "regular_after",
              "average_playtime_before", "average_playtime_after",
              "session_length_average_before", "session_length_average_after",
              "sessions_before", "sessions_after"
            ]))
          ' "$RUNNER_TEMP/plan-network.json" > /dev/null

          if ! performance_content_type="$(curl "${curl_options[@]}" --dump-header "$RUNNER_TEMP/plan-performance.headers" -o "$RUNNER_TEMP/plan-performance.json" -w '%{content_type}' 'https://ellan.site/api/plan-performance.php')"; then
            printf '::warning title=PLAN telemetry unavailable::Static homepage deployment passed, but plan-performance.php is temporarily unavailable.\n'
            exit 0
          fi
          case "$performance_content_type" in
            application/json*) ;;
            *) printf 'Unexpected PLAN performance API content type: %s\n' "$performance_content_type" >&2; exit 1 ;;
          esac
          grep -i -F 'x-robots-tag: noindex, nofollow' "$RUNNER_TEMP/plan-performance.headers" > /dev/null
          if grep -qi -F 'x-plan-data-stale: 1' "$RUNNER_TEMP/plan-performance.headers"; then
            printf 'PLAN performance API returned stale data\n' >&2
            exit 1
          fi
          jq -e '
            def exact_keys($expected): (keys | sort) == ($expected | sort);
            def nullable_series($length; $minimum; $maximum):
              (type == "array") and
              (length == $length) and
              all(.[]; . == null or ((type == "number") and . >= $minimum and . <= $maximum)) and
              (map(select(. != null)) | length >= 2);
            def nullable_number($minimum; $maximum):
              . == null or ((type == "number") and . >= $minimum and . <= $maximum);
            def valid_node_current($current):
              ($current | exact_keys([
                "players", "tps", "cpu", "memory_mb", "entities", "chunks", "disk_mb",
                "mspt_average", "mspt_p95", "ping_min", "ping_average", "ping_max"
              ])) and
              ($current.players | nullable_number(0; 1000000)) and
              ($current.tps | nullable_number(0; 21)) and
              ($current.cpu | nullable_number(0; 100)) and
              ($current.memory_mb | nullable_number(0; 1000000)) and
              ($current.entities | nullable_number(0; 100000000)) and
              ($current.chunks | nullable_number(0; 100000000)) and
              ($current.disk_mb | nullable_number(0; 1000000000)) and
              ($current.mspt_average | nullable_number(0; 1000000)) and
              ($current.mspt_p95 | nullable_number(0; 1000000)) and
              ($current.ping_min | nullable_number(0; 1000000)) and
              ($current.ping_average | nullable_number(0; 1000000)) and
              ($current.ping_max | nullable_number(0; 1000000));
            def valid_network_current($current):
              ($current | exact_keys([
                "players", "cpu_max", "memory_total_mb", "entities_total", "chunks_total",
                "tps_min", "mspt_p95_max", "reporting_nodes"
              ])) and
              ($current.players | nullable_number(0; 1000000)) and
              ($current.cpu_max | nullable_number(0; 100)) and
              ($current.memory_total_mb | nullable_number(0; 3000000)) and
              ($current.entities_total | nullable_number(0; 300000000)) and
              ($current.chunks_total | nullable_number(0; 300000000)) and
              ($current.tps_min | nullable_number(0; 21)) and
              ($current.mspt_p95_max | nullable_number(0; 1000000)) and
              ($current.reporting_nodes | nullable_number(0; 3));
            def valid_range($id; $label; $window; $bucket; $length):
              .[$id] as $range |
              ($range | exact_keys(["label", "window_ms", "bucket_ms", "timestamps"])) and
              ($range.label == $label) and
              ($range.window_ms == $window) and
              ($range.bucket_ms == $bucket) and
              ($range.timestamps | type == "array" and length == $length) and
              ($range.timestamps[0] % $bucket == 0) and
              ($range.timestamps[-1] - $range.timestamps[0] == $window) and
              all(range(1; $length); $range.timestamps[.] - $range.timestamps[. - 1] == $bucket);
            def valid_node_series($series; $length):
              ($series | exact_keys([
                "players", "tps", "cpu", "memory_mb", "entities", "chunks", "disk_mb",
                "mspt_average", "mspt_p95", "ping_min", "ping_average", "ping_max"
              ])) and
              ($series.players | nullable_series($length; 0; 1000000)) and
              ($series.tps | nullable_series($length; 0; 21)) and
              ($series.cpu | nullable_series($length; 0; 100)) and
              ($series.memory_mb | nullable_series($length; 0; 1000000)) and
              ($series.entities | nullable_series($length; 0; 100000000)) and
              ($series.chunks | nullable_series($length; 0; 100000000)) and
              ($series.disk_mb | nullable_series($length; 0; 1000000000)) and
              ($series.mspt_average | nullable_series($length; 0; 1000000)) and
              ($series.mspt_p95 | nullable_series($length; 0; 1000000)) and
              ($series.ping_min | nullable_series($length; 0; 1000000)) and
              ($series.ping_average | nullable_series($length; 0; 1000000)) and
              ($series.ping_max | nullable_series($length; 0; 1000000));
            def valid_network_series($series; $length):
              ($series | exact_keys([
                "players", "cpu_max", "memory_total_mb", "entities_total", "chunks_total",
                "tps_min", "mspt_p95_max", "reporting_nodes"
              ])) and
              ($series.players | nullable_series($length; 0; 1000000)) and
              ($series.cpu_max | nullable_series($length; 0; 100)) and
              ($series.memory_total_mb | nullable_series($length; 0; 3000000)) and
              ($series.entities_total | nullable_series($length; 0; 300000000)) and
              ($series.chunks_total | nullable_series($length; 0; 300000000)) and
              ($series.tps_min | nullable_series($length; 0; 21)) and
              ($series.mspt_p95_max | nullable_series($length; 0; 1000000)) and
              ($series.reporting_nodes | nullable_series($length; 0; 3));
            . as $payload |
            (exact_keys(["timestamp", "refresh_seconds", "ranges", "nodes", "network"])) and
            (.timestamp | type == "number") and
            (.refresh_seconds == 300) and
            (.timestamp >= ((now * 1000) - 1800000)) and
            (.ranges | exact_keys(["6h", "24h", "7d", "30d"])) and
            (.ranges | valid_range("6h"; "6 小时"; 21600000; 120000; 181)) and
            (.ranges | valid_range("24h"; "24 小时"; 86400000; 600000; 145)) and
            (.ranges | valid_range("7d"; "7 天"; 604800000; 3600000; 169)) and
            (.ranges | valid_range("30d"; "30 天"; 2592000000; 21600000; 121)) and
            (.nodes | type == "array" and length == 3) and
            ([.nodes[].id] == ["redstone", "spawn", "survival"]) and
            (.nodes[0].label == "红石服" and .nodes[0].source == "Redstone" and .nodes[0].color == "#f5be4f") and
            (.nodes[1].label == "主城服" and .nodes[1].source == "Spawn" and .nodes[1].color == "#5ed6c4") and
            (.nodes[2].label == "生存服" and .nodes[2].source == "Survival" and .nodes[2].color == "#8fdd55") and
            all(.nodes[];
              (exact_keys(["id", "label", "source", "color", "timestamp", "fresh", "current", "series"])) and
              (.timestamp | type == "number") and
              (.fresh | type == "boolean") and
              valid_node_current(.current) and
              (.series | exact_keys(["6h", "24h", "7d", "30d"])) and
              valid_node_series(.series["6h"]; 181) and
              valid_node_series(.series["24h"]; 145) and
              valid_node_series(.series["7d"]; 169) and
              valid_node_series(.series["30d"]; 121)
            ) and
            (.network | exact_keys(["timestamp", "current", "series"])) and
            (.network.timestamp | type == "number") and
            valid_network_current(.network.current) and
            (.network.series | exact_keys(["6h", "24h", "7d", "30d"])) and
            valid_network_series(.network.series["6h"]; 181) and
            valid_network_series(.network.series["24h"]; 145) and
            valid_network_series(.network.series["7d"]; 169) and
            valid_network_series(.network.series["30d"]; 121) and
            all(.network.series[]; all(.reporting_nodes[]; . == null or ((type == "number") and floor == .))) and
            (.network.current.reporting_nodes == null or ((.network.current.reporting_nodes | type == "number") and (.network.current.reporting_nodes | floor) == .network.current.reporting_nodes))
          ' "$RUNNER_TEMP/plan-performance.json" > /dev/null
