<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>艾尔岚 Wiki 编辑器</title><link rel="icon" href="/preview/img/icon.png"><link rel="stylesheet" href="/editor.css"><script defer src="/preview/js/vendor/lucide.min.js"></script><script defer src="/editor.js"></script></head>
<body>
  <header class="topbar"><div class="brand"><img src="/preview/img/icon.png" alt="" width="32" height="32"><strong>艾尔岚 <span>Wiki 编辑器</span></strong><small>本地</small></div><div class="top-actions"><span id="save-status" role="status">正在读取…</span><button id="undo" class="icon-button" title="撤销" aria-label="撤销" disabled><i data-lucide="undo-2"></i></button><button id="redo" class="icon-button" title="重做" aria-label="重做" disabled><i data-lucide="redo-2"></i></button><button id="export" title="导出当前草稿"><i data-lucide="download"></i><span>导出</span></button><button id="reload" title="重新读取磁盘文件"><i data-lucide="refresh-cw"></i><span>重新读取</span></button><button id="save" class="primary" disabled><i data-lucide="save"></i><span>保存到工程</span></button></div></header>
  <div class="workspace">
    <aside class="library"><div class="library-head"><label class="search"><i data-lucide="search"></i><input id="filter" type="search" placeholder="查找内容" aria-label="查找内容"></label><select id="section" aria-label="编辑类型"><option value="articles">教程</option><option value="commands">常用命令</option><option value="categories">分类</option><option value="featured">首页推荐</option></select></div><nav id="entries" aria-label="内容列表"></nav><button id="add" class="add-button"><i data-lucide="plus"></i><span>新增教程</span></button><div class="library-footer"><a href="/preview/wiki.html" target="_blank">打开完整预览 <i data-lucide="external-link"></i></a></div></aside>
    <main class="editor"><div class="editor-heading"><div><small id="entry-id"></small><h1 id="entry-title">正在打开工程</h1></div><button id="delete" class="icon-button danger" title="删除当前内容" aria-label="删除当前内容"><i data-lucide="trash-2"></i></button></div><form id="fields" autocomplete="off"></form><div id="error" role="alert" hidden></div></main>
    <section class="preview-pane" aria-label="实时预览"><div class="preview-toolbar"><strong>实时预览</strong><span id="preview-status" role="status"></span><div class="segmented"><button id="desktop" class="selected icon-button" title="适应预览区宽度" aria-label="适应预览区宽度"><i data-lucide="monitor"></i></button><button id="mobile" class="icon-button" title="手机预览" aria-label="手机预览"><i data-lucide="smartphone"></i></button></div><button id="preview-home" class="icon-button" title="预览手册首页" aria-label="预览手册首页"><i data-lucide="house"></i></button></div><div class="preview-stage"><iframe id="preview" title="Wiki 实时预览"></iframe></div></section>
  </div>
  <dialog id="asset-dialog"><div class="dialog-head"><h2>选择媒体</h2><button class="icon-button" data-close="asset-dialog" title="关闭" aria-label="关闭媒体库"><i data-lucide="x"></i></button></div><div class="asset-tools"><input id="asset-filter" type="search" placeholder="按文件名筛选" aria-label="筛选媒体"><button id="upload-dialog"><i data-lucide="upload"></i>导入文件</button></div><div id="asset-list"></div><div class="asset-pages"><button id="asset-prev" class="icon-button" title="上一页媒体" aria-label="上一页媒体"><i data-lucide="chevron-left"></i></button><span id="asset-count"></span><button id="asset-next" class="icon-button" title="下一页媒体" aria-label="下一页媒体"><i data-lucide="chevron-right"></i></button></div></dialog>
  <dialog id="new-dialog"><form id="new-form"><div class="dialog-head"><h2>新增教程</h2><button type="button" class="icon-button" data-close="new-dialog" title="关闭" aria-label="关闭新增教程"><i data-lucide="x"></i></button></div><label>教程名称<input name="title" required maxlength="80"></label><label>链接 ID<input name="id" required pattern="[a-z][a-z0-9-]*" placeholder="例如：my-new-guide"></label><label>所属分类<select name="category"></select></label><button class="primary" type="submit">创建教程</button></form></dialog>
  <input id="file" type="file" hidden>
  <div id="toast" role="status"></div>
</body></html>
